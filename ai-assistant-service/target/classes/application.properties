spring.application.name=ai-assistant-service
server.port=8095
spring.cloud.netflix.eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
spring.cloud.netflix.eureka.client.register-with-eureka=true
spring.cloud.netflix.eureka.client.fetch-registry=true

# Claude API Configuration
claude.api.key=${CLAUDE_API_KEY}
claude.api.url=https://api.anthropic.com/v1/messages
claude.api.model=claude-3-5-sonnet-20241022