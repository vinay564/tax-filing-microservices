apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-assistant-service
  template:
    metadata:
      labels:
        app: ai-assistant-service
    spec:
      containers:
      - name: ai-assistant-service
        image: ai-assistant-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8095
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka"
        - name: CLAUDE_API_KEY
          valueFrom:
            secretKeyRef:
              name: claude-api-secret
              key: api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant-service
  namespace: default
spec:
  selector:
    app: ai-assistant-service
  ports:
  - protocol: TCP
    port: 8095
    targetPort: 8095
  type: NodePort