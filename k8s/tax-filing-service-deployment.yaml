apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-filing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tax-filing-service
  template:
    metadata:
      labels:
        app: tax-filing-service
    spec:
      containers:
        - name: tax-filing-service
          image: vinay564/tax-filing-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: tax-filing-service
spec:
  type: ClusterIP
  selector:
    app: tax-filing-service
  ports:
    - port: 8081
      targetPort: 8081